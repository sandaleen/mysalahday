<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Salah Day</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff8e1;
      color: #212121;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    header, main, .sheet { padding: 16px; }
    header {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 32px; }
    .next { margin: 4px 0 0; color: #0d47a1; font-size: 18px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    button.pill {
      border: 0;
      border-radius: 999px;
      color: white;
      padding: 10px 16px;
      cursor: pointer;
    }
    .grid { display: grid; gap: 8px; }
    .salah { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .tasks { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 8px; }
    .card {
      border: 0;
      border-radius: 16px;
      color: white;
      min-height: 92px;
      padding: 8px;
      cursor: pointer;
      text-align: center;
    }
    .card b { display: block; font-size: 20px; }
    .card span { display: block; font-size: 18px; margin-top: 4px; }
    .card small {
      display: inline-block;
      margin-top: 6px;
      background: white;
      color: black;
      border-radius: 10px;
      padding: 3px 8px;
    }
    .card.done { background: #c8e6c9 !important; color: #1b5e20; }
    .card.done small { background: #2e7d32; color: white; }
    .sheet {
      position: fixed;
      inset: 0;
      background: #fff8e1;
      overflow: auto;
      z-index: 2;
    }
    .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
    input[type="search"], input[type="text"] {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      font-size: 18px;
      border: 1px solid #90a4ae;
      border-radius: 12px;
    }
    .hit {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: #0d47a1;
      font-size: 20px;
      padding: 10px 4px;
      cursor: pointer;
    }
    .hit.on { background: #c8e6c9; color: #1b5e20; border-radius: 10px; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
    .list { max-height: 52vh; overflow: auto; }
    .dial {
      width: min(320px, 80vw);
      height: min(320px, 80vw);
      margin: 12px auto;
      border-radius: 50%;
      border: 10px solid #1565c0;
      background: white;
      position: relative;
    }
    .dial.facing { border-color: #2e7d32; }
    .needle {
      position: absolute;
      left: 50%;
      top: 18%;
      width: 8px;
      height: 32%;
      background: #212121;
      transform-origin: bottom center;
      border-radius: 8px;
    }
    .kaaba {
      position: absolute;
      width: 36px;
      height: 36px;
      background: #212121;
      border-radius: 6px;
      transform: translate(-50%, -50%);
    }
    .kaaba i {
      position: absolute;
      left: 0; right: 0; top: 42%;
      height: 6px;
      background: #ffd54f;
    }
    .mark {
      position: absolute;
      font-weight: 700;
      transform: translate(-50%, -50%);
    }
    .mark.n { color: #b71c1c; }
    audio { width: 100%; margin-top: 12px; }
    @media (max-width: 800px) {
      .salah { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tasks { grid-template-columns: 1fr 1fr; }
      .split { grid-template-columns: 1fr; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div id="app">Loading My Salah Day…</div>
  <script>
    const params = new URLSearchParams(location.search);
    if (!params.has("web") && /Android/i.test(navigator.userAgent)) {
      const fallback = location.origin + location.pathname + "?web=1";
      location.replace(
        "intent://open#Intent;scheme=mysalahday;package=com.example.chores;S.browser_fallback_url=" +
        encodeURIComponent(fallback) + ";end"
      );
    }

    const salahs = [
      ["Fajr", "#3949ab"],
      ["Dhuhr", "#f9a825"],
      ["Asr", "#ef6c00"],
      ["Maghrib", "#8e24aa"],
      ["Isha", "#283593"],
    ];
    const tasks = [
      ["Make wudu", "💧", "#00897b", "fajr", -10, false],
      ["Brush teeth", "🪥", "#26a69a", "clock", [7, 0], false],
      ["Get dressed", "👕", "#42a5f5", "clock", [7, 10], false],
      ["Make the bed", "🛏️", "#5c6bc0", "clock", [7, 20], false],
      ["Breakfast", "🥣", "#fb8c00", "clock", [7, 30], false],
      ["Read Quran", "📖", "#43a047", "clock", [7, 50], false],
      ["Go to school", "🏫", "#1565c0", "clock", [8, 15], true],
      ["Homework", "✏️", "#8d6e63", "clock", [16, 0], true],
      ["Snack", "🍎", "#ef6c00", "clock", [15, 30], false],
      ["Put toys away", "🧸", "#8e24aa", "clock", [18, 30], false],
      ["Dinner", "🍲", "#00838f", "maghrib", 15, false],
      ["Bedtime", "🌙", "#5e35b1", "clock", [21, 30], false],
    ];
    const reciters = [
      ["Mishary Alafasy", "https://server8.mp3quran.net/afs/"],
      ["Abdulrahman Al-Sudais", "https://server11.mp3quran.net/sds/"],
      ["Saud Al-Shuraim", "https://server7.mp3quran.net/shur/"],
      ["Abdul Basit", "https://server7.mp3quran.net/basit/"],
      ["Mahmoud Khalil Al-Husary", "https://server13.mp3quran.net/husr/"],
      ["Yasser Al-Dosari", "https://server11.mp3quran.net/yasser/"],
      ["Mohammed Siddiq Al-Minshawi", "https://server10.mp3quran.net/minsh/"],
      ["Maher Al-Muaiqly", "https://server12.mp3quran.net/maher/"],
      ["Ahmad Al-Ajmy", "https://server10.mp3quran.net/ajm/"],
    ];
    const surahs = ["Al-Fatihah","Al-Baqarah","Ali 'Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Tawbah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadila","Al-Hashr","Al-Mumtahanah","As-Saf","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Layl","Ad-Duha","Ash-Sharh","At-Tin","Al-Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-Adiyat","Al-Qari'ah","At-Takathur","Al-Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];

    const app = document.querySelector("#app");
    const audio = new Audio();
    let screen = "home";
    let place = loadPlace();
    let timings = null;
    let query = "";
    let hits = [];
    let reciterQuery = "";
    let surahQuery = "";
    let reciter = 0;
    let surah = 0;
    let playingTitle = "";
    let heading = null;
    let northAt = null;

    function loadPlace() {
      try {
        const saved = JSON.parse(localStorage.getItem("mysalahday-place") || "null");
        if (saved && saved.latitude) return saved;
      } catch (error) {}
      return {
        name: "Dublin",
        admin1: "California",
        country: "United States",
        country_code: "US",
        latitude: 37.7021,
        longitude: -121.9358,
        timezone: "America/Los_Angeles",
      };
    }

    function savePlace(next) {
      place = next;
      localStorage.setItem("mysalahday-place", JSON.stringify(next));
      timings = null;
      loadTimes();
    }

    function dayKey() {
      return dateParts(place.timezone).key;
    }

    function doneSet() {
      return new Set(JSON.parse(localStorage.getItem("mysalahday-done-" + dayKey()) || "[]"));
    }

    function saveDone(set) {
      localStorage.setItem("mysalahday-done-" + dayKey(), JSON.stringify([...set]));
      draw();
    }

    function dateParts(timeZone) {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone,
        weekday: "short",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23",
      }).formatToParts(new Date());
      const get = (type) => parts.find((part) => part.type === type).value;
      return {
        key: get("year") + "-" + get("month") + "-" + get("day"),
        weekday: get("weekday"),
        minutes: Number(get("hour")) * 60 + Number(get("minute")),
      };
    }

    function methodFor(code) {
      if (code === "US" || code === "CA") return 2;
      if (["PK", "IN", "BD", "AF"].includes(code)) return 1;
      if (["SA", "AE", "KW", "QA", "BH", "OM", "YE"].includes(code)) return 4;
      if (code === "EG") return 5;
      return 3;
    }

    async function loadTimes() {
      const day = dateParts(place.timezone);
      const [year, month, date] = day.key.split("-");
      const url = "https://api.aladhan.com/v1/timings/" + date + "-" + month + "-" + year +
        "?latitude=" + place.latitude + "&longitude=" + place.longitude +
        "&method=" + methodFor(place.country_code) + "&school=1";
      const response = await fetch(url);
      const body = await response.json();
      timings = {};
      for (const [name] of salahs) timings[name] = toMinutes(body.data.timings[name]);
      draw();
    }

    function toMinutes(value) {
      const [hour, minute] = value.split(":").map(Number);
      return hour * 60 + minute;
    }

    function clock(minutes) {
      const wrapped = (minutes + 1440) % 1440;
      const hour = Math.floor(wrapped / 60);
      const minute = wrapped % 60;
      const suffix = hour >= 12 ? "PM" : "AM";
      const shown = hour % 12 || 12;
      return shown + ":" + String(minute).padStart(2, "0") + " " + suffix;
    }

    function taskMinutes(task) {
      if (!timings) return null;
      if (task[3] === "clock") return task[4][0] * 60 + task[4][1];
      if (task[3] === "fajr") return timings.Fajr + task[4];
      return timings.Maghrib + task[4];
    }

    function placeLabel() {
      return [place.name, place.admin1, place.country].filter(Boolean).join(", ");
    }

    function nextText() {
      if (!timings) return "Hanafi · Loading prayer times…";
      const now = dateParts(place.timezone).minutes;
      const upcoming = salahs.find(([name]) => timings[name] > now);
      if (upcoming) return "Hanafi · Next: " + upcoming[0] + " at " + clock(timings[upcoming[0]]);
      return "Hanafi · Next: Fajr tomorrow at " + clock(timings.Fajr);
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[char]));
    }

    function qiblaBearing() {
      const lat1 = place.latitude * Math.PI / 180;
      const lon1 = place.longitude * Math.PI / 180;
      const lat2 = 21.4225 * Math.PI / 180;
      const lon2 = 39.8262 * Math.PI / 180;
      const dLon = lon2 - lon1;
      const y = Math.sin(dLon) * Math.cos(lat2);
      const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function directionName(degrees) {
      const names = ["north","north-northeast","northeast","east-northeast","east","east-southeast","southeast","south-southeast","south","south-southwest","southwest","west-southwest","west","west-northwest","northwest","north-northwest"];
      return names[Math.floor(((degrees + 11.25) % 360) / 22.5)];
    }

    function playQuran(index) {
      surah = index;
      const folder = reciters[reciter][1];
      audio.src = folder + String(index + 1).padStart(3, "0") + ".mp3";
      audio.play();
      playingTitle = (index + 1) + ". " + surahs[index] + " · " + reciters[reciter][0];
      draw();
    }

    audio.onended = () => {
      if (surah < surahs.length - 1) playQuran(surah + 1);
    };

    function draw() {
      if (screen === "city") return drawCity();
      if (screen === "quran") return drawQuran();
      if (screen === "qibla") return drawQibla();
      const done = doneSet();
      const weekend = ["Sat", "Sun"].includes(dateParts(place.timezone).weekday);
      const visible = tasks.filter((task) => !task[5] || !weekend);
      app.innerHTML = `
        <header>
          <div>
            <h1>My Salah Day</h1>
            <p class="next">${esc(nextText())}</p>
          </div>
          <div class="actions">
            <button class="pill" style="background:#1565c0" onclick="openCity()">${esc(place.name)}</button>
            <button class="pill" style="background:#4e342e" onclick="openQibla()">Kaaba</button>
            <button class="pill" style="background:#2e7d32" onclick="openQuran()">Quran</button>
            <button class="pill" style="background:#6a1b9a" onclick="newDay()">New day</button>
          </div>
        </header>
        <main>
          <div class="grid salah">
            ${salahs.map(([name, color]) => `
              <button class="card ${done.has(name) ? "done" : ""}" style="background:${color}" onclick="toggleDone('${name}')">
                <b>${name}</b>
                <span>${timings ? clock(timings[name]) : "…"}</span>
                <small>${done.has(name) ? "Prayed" : "Adhan"}</small>
              </button>`).join("")}
          </div>
          <div class="grid tasks">
            ${visible.map((task) => {
              const minutes = taskMinutes(task);
              const finished = done.has(task[0]);
              return `<button class="card ${finished ? "done" : ""}" style="background:${task[2]}" onclick="toggleDone('${esc(task[0])}')">
                <b>${task[1]} ${esc(task[0])}</b>
                <span>${finished ? "Done" : (minutes == null ? "…" : clock(minutes))}</span>
              </button>`;
            }).join("")}
          </div>
        </main>`;
    }

    function drawCity() {
      app.innerHTML = `
        <div class="sheet">
          <div class="row">
            <h1>Where do you live?</h1>
            <button class="pill" style="background:#6a1b9a" onclick="screen='home';draw()">Close</button>
          </div>
          <button class="pill" style="background:#1565c0;margin-top:8px" onclick="useLocation()">Use my location</button>
          <input id="cityq" type="search" placeholder="City, state, or country" value="${esc(query)}" oninput="searchCity(this.value)">
          <div id="hits">${hits.map((hit, index) => `<button class="hit" onclick="pickCity(${index})">${esc(hit.label)}</button>`).join("") || "<p>Type a city, state, or country.</p>"}</div>
        </div>`;
    }

    function drawQuran() {
      const reciterRows = reciters.filter((item) => item[0].toLowerCase().includes(reciterQuery.toLowerCase()));
      const surahRows = surahs.map((name, index) => [name, index]).filter(([name, index]) => {
        const text = surahQuery.trim().toLowerCase();
        return !text || name.toLowerCase().includes(text) || String(index + 1).startsWith(text);
      });
      app.innerHTML = `
        <div class="sheet">
          <div class="row">
            <h1>Listen to Quran</h1>
            <button class="pill" style="background:#6a1b9a" onclick="screen='home';draw()">Close</button>
          </div>
          <div class="split">
            <div>
              <b>Reciter</b>
              <input type="search" placeholder="Find a reciter" oninput="reciterQuery=this.value;drawQuran()">
              <div class="list">${reciterRows.map((item) => {
                const index = reciters.indexOf(item);
                return `<button class="hit ${index === reciter ? "on" : ""}" onclick="reciter=${index};playQuran(surah)">${esc(item[0])}</button>`;
              }).join("")}</div>
            </div>
            <div>
              <b>Surah</b>
              <input type="search" placeholder="Find a surah" oninput="surahQuery=this.value;drawQuran()">
              <div class="list">${surahRows.map(([name, index]) => `<button class="hit ${index === surah ? "on" : ""}" onclick="playQuran(${index})">${index + 1}. ${esc(name)}</button>`).join("")}</div>
            </div>
          </div>
          <p>${esc(playingTitle || "Tap a surah to play it. It keeps going through the Quran.")}</p>
          <div class="actions">
            <button class="pill" style="background:#1565c0" onclick="if(surah>0)playQuran(surah-1)">Back</button>
            <button class="pill" style="background:#2e7d32" onclick="audio.paused?audio.play():audio.pause()">Play / Pause</button>
            <button class="pill" style="background:#1565c0" onclick="if(surah<surahs.length-1)playQuran(surah+1)">Next</button>
            <button class="pill" style="background:#c62828" onclick="audio.pause();playingTitle='';draw()">Stop</button>
          </div>
        </div>`;
    }

    function drawQibla() {
      const bearing = qiblaBearing();
      const face = heading == null || northAt == null ? 0 : (heading - northAt + 360) % 360;
      const turn = Math.abs(((bearing - face + 540) % 360) - 180);
      const aligned = northAt != null && turn <= 8;
      const angle = bearing - face;
      app.innerHTML = `
        <div class="sheet">
          <div class="row">
            <h1>Kaaba direction</h1>
            <button class="pill" style="background:#6a1b9a" onclick="screen='home';draw()">Close</button>
          </div>
          <div class="dial ${aligned ? "facing" : ""}" id="dial">
            ${["N", "E", "S", "W"].map((letter, index) => {
              const spot = index * 90 - face;
              const rad = spot * Math.PI / 180;
              const x = 50 + Math.sin(rad) * 38;
              const y = 50 - Math.cos(rad) * 38;
              return `<b class="mark ${letter === "N" ? "n" : ""}" style="left:${x}%;top:${y}%">${letter}</b>`;
            }).join("")}
            <div class="needle" style="transform:translateX(-50%) rotate(${angle}deg)"></div>
            <div class="kaaba" style="left:${50 + Math.sin(angle * Math.PI / 180) * 30}%;top:${50 - Math.cos(angle * Math.PI / 180) * 30}%"><i></i></div>
          </div>
          <h2>The Kaaba is ${directionName(bearing)}.</h2>
          <p>${Math.round(bearing)}° from north, from ${esc(placeLabel())}.</p>
          <p>${aligned ? "You are facing the Kaaba." : (northAt == null ? "Point the top of the screen north, then tap the button. On a phone, turn until the Kaaba is at the top." : "Turn until the Kaaba is at the top of the screen.")}</p>
          <button class="pill" style="background:#4e342e" onclick="setNorth()">Top is north</button>
        </div>`;
    }

    function toggleDone(name) {
      const done = doneSet();
      if (done.has(name)) done.delete(name); else done.add(name);
      saveDone(done);
    }

    function newDay() {
      localStorage.removeItem("mysalahday-done-" + dayKey());
      draw();
    }

    function openCity() { screen = "city"; query = ""; hits = []; draw(); }
    function openQuran() { screen = "quran"; draw(); }
    function openQibla() { screen = "qibla"; listenCompass(); draw(); }

    let searchTimer = 0;
    function searchCity(value) {
      query = value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        const text = value.trim();
        if (!text) { hits = []; drawCity(); return; }
        const response = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=30&language=en&format=json&name=" + encodeURIComponent(text));
        const body = await response.json();
        hits = (body.results || []).map((item) => ({
          label: [item.name, item.admin1, item.country].filter(Boolean).join(", "),
          name: item.name,
          admin1: item.admin1 || "",
          country: item.country || "",
          country_code: item.country_code || "",
          latitude: item.latitude,
          longitude: item.longitude,
          timezone: item.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone,
        }));
        drawCity();
        const box = document.querySelector("#cityq");
        if (box) { box.focus(); box.value = value; box.setSelectionRange(value.length, value.length); }
      }, 250);
    }

    function pickCity(index) {
      savePlace(hits[index]);
      screen = "home";
      draw();
    }

    function useLocation() {
      navigator.geolocation.getCurrentPosition(async (position) => {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;
        const response = await fetch("https://geocoding-api.open-meteo.com/v1/reverse?latitude=" + latitude + "&longitude=" + longitude + "&language=en&format=json");
        const body = await response.json();
        const item = (body.results || [])[0] || {};
        savePlace({
          name: item.name || "My location",
          admin1: item.admin1 || "",
          country: item.country || "",
          country_code: item.country_code || "",
          latitude,
          longitude,
          timezone: item.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone,
        });
        screen = "home";
        draw();
      });
    }

    function setNorth() { northAt = heading == null ? 0 : heading; drawQibla(); }

    function listenCompass() {
      window.addEventListener("deviceorientation", (event) => {
        if (event.alpha == null || screen !== "qibla") return;
        heading = event.alpha;
        const dial = document.querySelector("#dial");
        if (dial) drawQibla();
      });
    }

    window.openCity = openCity;
    window.openQuran = openQuran;
    window.openQibla = openQibla;
    window.newDay = newDay;
    window.toggleDone = toggleDone;
    window.searchCity = searchCity;
    window.pickCity = pickCity;
    window.useLocation = useLocation;
    window.playQuran = playQuran;
    window.setNorth = setNorth;
    window.drawQuran = drawQuran;

    draw();
    loadTimes();
    if (navigator.geolocation && !localStorage.getItem("mysalahday-place")) useLocation();
